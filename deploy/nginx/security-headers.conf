# Security headers snippet for kosmetologwiktoriacwik.pl
# Included in all location blocks that emit add_header directives.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# Google Identity Services otwiera okno logowania i komunikuje się z nim przez postMessage.
# Domyślne COOP zerwałoby ten kanał; allow-popups zachowuje izolację dla reszty strony.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.google.com https://maps.googleapis.com https://accounts.google.com https://apis.google.com https://connect.facebook.net https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.facebook.com https://www.googletagmanager.com https://*.google-analytics.com; frame-src https://maps.google.com https://www.google.com https://accounts.google.com https://www.facebook.com https://staticxx.facebook.com; connect-src 'self' wss: https://fonts.googleapis.com https://fonts.gstatic.com https://accounts.google.com https://graph.facebook.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://api.bigdatacloud.net https://cdn.jsdelivr.net; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" always;
